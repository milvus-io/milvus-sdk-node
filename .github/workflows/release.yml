name: Stage package for npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the npm package contents without uploading'
        required: true
        default: true
        type: boolean
      npm_tag:
        description: 'npm dist-tag to apply after approval of a manual submission'
        required: true
        default: 'latest'
        type: string

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: update submodules
        run: |
          git submodule init
          yarn pre

      - name: Generate proto json
        run: |
          yarn proto:json

      - name: Build app
        run: |
          yarn build

      - name: Check npm package contents
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          npm pack --dry-run
          echo 'npm package contents checked (dry run).' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage package for npm approval
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_NPM_TAG: ${{ inputs.npm_tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            NPM_TAG="$MANUAL_NPM_TAG"
          elif [ "$PRERELEASE" = "true" ]; then
            NPM_TAG=next
          else
            LATEST_RELEASE_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
            if [ "$RELEASE_TAG" = "$LATEST_RELEASE_TAG" ]; then
              NPM_TAG=latest
            else
              VERSION_TAG=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
              NPM_TAG="release-$VERSION_TAG"
            fi
          fi

          echo "Staging $PACKAGE@$VERSION with npm dist-tag $NPM_TAG"
          if ! RESULT=$(npm stage publish --tag "$NPM_TAG" --json); then
            printf '%s\n' "$RESULT" >&2
            exit 1
          fi
          if ! STAGE_ID=$(jq -er --arg package "$PACKAGE" '.[$package].stageId | strings | select(length > 0)' <<< "$RESULT"); then
            echo '::error::npm accepted the request without a Stage ID. Check Staged Packages before retrying.'
            exit 1
          fi

          {
            echo '### npm package staged for approval'
            echo
            printf -- '- Package `%s@%s`\n- dist-tag `%s`\n- Stage ID `%s`\n' "$PACKAGE" "$VERSION" "$NPM_TAG" "$STAGE_ID"
            echo
            printf 'A package maintainer can approve this submission with `npm stage approve %s` and npm 2FA.\n' "$STAGE_ID"
            printf 'After approval, check `npm view %s@%s version --prefer-online` and confirm `npm view %s@%s version --prefer-online` returns `%s`.\n' "$PACKAGE" "$VERSION" "$PACKAGE" "$NPM_TAG" "$VERSION"
          } | tee -a "$GITHUB_STEP_SUMMARY"
