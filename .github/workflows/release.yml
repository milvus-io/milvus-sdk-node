name: Publish package to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the npm package contents without uploading'
        required: true
        default: true
        type: boolean
      npm_tag:
        description: 'npm dist-tag to use when publishing manually'
        required: true
        default: 'latest'
        type: string

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: update submodules
        run: |
          git submodule init
          yarn pre

      - name: Generate proto json
        run: |
          yarn proto:json

      - name: Build app
        run: |
          yarn build

      - name: Check npm package contents
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          npm pack --dry-run
          echo 'npm package contents checked (dry run).' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm and verify public availability
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_NPM_TAG: ${{ inputs.npm_tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            NPM_TAG="$MANUAL_NPM_TAG"
          elif [ "$PRERELEASE" = "true" ]; then
            NPM_TAG=next
          else
            LATEST_RELEASE_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
            if [ "$RELEASE_TAG" = "$LATEST_RELEASE_TAG" ]; then
              NPM_TAG=latest
            else
              VERSION_TAG=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
              NPM_TAG="release-$VERSION_TAG"
            fi
          fi

          echo "Publishing $PACKAGE@$VERSION with npm dist-tag $NPM_TAG"
          npm publish --tag "$NPM_TAG"

          # npm may process the package asynchronously after accepting it.
          # Retry reads only; never resubmit a package while it is processing.
          for attempt in {1..18}; do
            PUBLISHED_VERSION=$(npm view "$PACKAGE@$VERSION" version --prefer-online 2>/dev/null || true)
            TAG_VERSION=$(npm view "$PACKAGE@$NPM_TAG" version --prefer-online 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$VERSION" ] && [ "$TAG_VERSION" = "$VERSION" ]; then
              break
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          if [ "$PUBLISHED_VERSION" != "$VERSION" ] || [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Public npm verification failed for $PACKAGE@$VERSION with dist-tag $NPM_TAG. Inspect the registry and publish logs before retrying."
            exit 1
          fi

          {
            echo '### npm package published and verified'
            echo
            printf -- '- Package `%s@%s`\n- dist-tag `%s`\n' "$PACKAGE" "$VERSION" "$NPM_TAG"
            echo '- Exact version and dist-tag verified on the public registry.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
