name: Run tests and coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main, '2.4', '2.5']
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the existing job ID for repositories requiring this check.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(github.event_name == 'schedule' && '[20261117,20261118,20261119]' || '[20261117]') }}
    env:
      NODE_ENV: dev
      TZ: UTC
      MILVUS_ADDRESS: '127.0.0.1:19530'
      MILVUS_TELEMETRY_API: 'http://127.0.0.1:9091/api/v1/_telemetry'
      MILVUS_TELEMETRY_E2E: 'true'
      MILVUS_TEST_SEED: ${{ matrix.seed }}
      MILVUS_TEST_WORKERS: '4'
      MILVUS_TEST_GRPC_PORT: '19530'
      MILVUS_TEST_HEALTH_PORT: '9091'
      MILVUS_TEST_MINIO_PORT: '9000'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare protobuf dependencies
        run: npm run pre

      - name: Select SDK target Milvus version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'MILVUS_VERSION=' + require('./package.json').milvusVersion + '\n')"

      - name: Start Milvus and MinIO and wait for health
        env:
          MILVUS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TESTS_REQUIRED: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        run: |
          if [ -n "${MILVUS_OPENAI_API_KEY}" ]; then
            echo "MILVUS_OPENAI_ENABLED=1" >> "$GITHUB_ENV"
          elif [ "${OPENAI_TESTS_REQUIRED}" = "true" ]; then
            echo "::error::OPENAI_API_KEY is required for text embedding integration tests."
            exit 1
          else
            echo "MILVUS_OPENAI_ENABLED=0" >> "$GITHUB_ENV"
            echo "::notice::OpenAI text embedding tests are skipped because secrets are unavailable to this fork or Dependabot PR."
          fi
          npm run test:env:up

      - name: Run SDK checks, full suite, package lifecycle and coverage gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:ci 2>&1 | tee test-results/tests.log

      - name: Dump service state and errors on failure
        if: failure()
        run: |
          docker compose -f test2/environment/compose.yml ps -a
          docker compose -f test2/environment/compose.yml logs --no-color --tail=300

      - name: Save service logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f test2/environment/compose.yml logs --no-color > test-results/services.log 2>&1

      - name: Preserve test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.seed }}
          path: |
            test-results/
            coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # Match main's report formats: LCOV alone changes Codecov's line/partial mapping.
          files: ./coverage/clover.xml,./coverage/coverage-final.json,./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop test services
        if: always()
        run: npm run test:env:down
